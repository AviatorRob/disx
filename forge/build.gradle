plugins {
    id "com.gradleup.shadow" version "9.0.0-beta4"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "disx.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowDependencies
}

repositories {
    maven { url 'https://jitpack.io' }

    mavenCentral()

    maven {url 'https://mvnrepository.com/artifact/org.json/json'}

    maven { url 'https://mvnrepository.com/artifact/com.github.sealedtx/java-youtube-downloader'}

    maven{ url "https://maven.arbjerg.dev/releases" }

    maven{url "https://maven.lavalink.dev/releases"}

    maven { url "https://maven.shedaniel.me" }

    maven { url 'https://mvnrepository.com/artifact/com.grack/nanojson'}

    maven { url 'https://mvnrepository.com/artifact/org.mozilla/rhino'}

    maven { url 'https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-annotations'}

    maven { url 'https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core'}

    maven { url 'https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind'}

}


dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    forgeRuntimeLibrary 'com.alibaba:fastjson:+'
    forgeRuntimeLibrary 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    forgeRuntimeLibrary 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    forgeRuntimeLibrary 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    forgeRuntimeLibrary 'com.github.walkyst.JAADec-fork:jaadec-ext-aac:0.1.3'
    forgeRuntimeLibrary group: 'org.json', name: 'json', version: '+'
    forgeRuntimeLibrary 'org.junit.jupiter:junit-jupiter:+'
    forgeRuntimeLibrary 'org.junit.jupiter:junit-jupiter-api:+'
    forgeRuntimeLibrary 'org.junit.jupiter:junit-jupiter-engine:+'
    forgeRuntimeLibrary 'org.junit.jupiter:junit-jupiter-params:+'
    forgeRuntimeLibrary 'org.junit.platform:junit-platform-commons:+'
    forgeRuntimeLibrary 'org.junit.platform:junit-platform-engine:+'
    forgeRuntimeLibrary 'org.mozilla:rhino:+'
    forgeRuntimeLibrary 'org.mozilla:rhino-engine:+'
    forgeRuntimeLibrary 'org.opentest4j:opentest4j:+'
    forgeRuntimeLibrary group: 'org.jsoup', name: 'jsoup', version: '+'
    forgeRuntimeLibrary 'org.apache.httpcomponents:httpclient:+'
    forgeRuntimeLibrary 'commons-logging:commons-logging:+'
    forgeRuntimeLibrary 'org.apache.httpcomponents:httpcore:+'
    forgeRuntimeLibrary group: 'com.grack', name: 'nanojson', version: '+'

    shadowDependencies 'com.alibaba:fastjson:+'
    shadowDependencies 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    shadowDependencies 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    shadowDependencies 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    shadowDependencies 'com.github.walkyst.JAADec-fork:jaadec-ext-aac:0.1.3'
    shadowDependencies group: 'org.json', name: 'json', version: '+'
    shadowDependencies 'org.junit.jupiter:junit-jupiter:+'
    shadowDependencies 'org.junit.jupiter:junit-jupiter-api:+'
    shadowDependencies 'org.junit.jupiter:junit-jupiter-engine:+'
    shadowDependencies 'org.junit.jupiter:junit-jupiter-params:+'
    shadowDependencies 'org.junit.platform:junit-platform-commons:+'
    shadowDependencies 'org.junit.platform:junit-platform-engine:+'
    shadowDependencies 'org.mozilla:rhino:+'
    shadowDependencies 'org.mozilla:rhino-engine:+'
    shadowDependencies 'org.opentest4j:opentest4j:+'
    shadowDependencies group: 'org.jsoup', name: 'jsoup', version: '+'
    shadowDependencies 'org.apache.httpcomponents:httpclient:+'
    shadowDependencies 'commons-logging:commons-logging:+'
    shadowDependencies 'org.apache.httpcomponents:httpcore:+'
    shadowDependencies group: 'com.grack', name: 'nanojson', version: '+'
    shadowDependencies("commons-io:commons-io:2.21.0")

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:${rootProject.forge_REI_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    relocate 'org.apache', 'disxshadowed.org.apache'
    relocate 'org.mozilla', 'disxshadowed.rhino'
    relocate 'com.fasterxml', 'disxshadowed.com.fasterxml'
    relocate 'com.grack', 'disxshadowed.com.grack'
    relocate 'org.mozilla.javascript', 'disxshadowed.rhino'

    configurations = [project.configurations.shadowCommon, project.configurations.shadowDependencies]

    archiveClassifier = "dev-shadow"

}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

